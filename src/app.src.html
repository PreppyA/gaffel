<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF0F5">
<title>Seated – find og book bord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%234B3B6B'/%3E%3Cpath d='M15.2 9.6c-.7 4.1-.7 8.3.1 12.4h10.6M15.9 22l-1.2 8.4M25.2 22l1.2 8.4M16.3 26.4h8.6' fill='none' stroke='%23fff' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* Visuel identitet: lavender blush som baggrund, lavendel som flader, dyb blomme til tekst og knapper */
:root{
  --bg:#FFF0F5; --card:#FFFFFF; --tile:#F3F0FB; --lav:#E6E6FA; --ink:#2A2140; --ink-2:#776C8C; --line:#EADFEA;
  --btn:#4B3B6B; --btn-ink:#FFFFFF; --accent:#A23E72; --accent-soft:#FBE4EE; --hero:#3D2F5A;
  --map:#EFEAF7; --block:#E3DCF0; --street:#FFFFFF;
  --shadow:0 1px 2px rgba(75,59,107,.04),0 10px 26px rgba(75,59,107,.07);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#17121F; --card:#221B2D; --tile:#2C2340; --lav:#2C2340; --ink:#F3EEFA; --ink-2:#AFA3C4; --line:#3A2F4C;
    --btn:#E6E6FA; --btn-ink:#2A2140; --accent:#E59BC2; --accent-soft:#3B2234; --hero:#0F0B16;
    --map:#1E1828; --block:#2A2238; --street:#352B47; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17121F; --card:#221B2D; --tile:#2C2340; --lav:#2C2340; --ink:#F3EEFA; --ink-2:#AFA3C4; --line:#3A2F4C;
  --btn:#E6E6FA; --btn-ink:#2A2140; --accent:#E59BC2; --accent-soft:#3B2234; --hero:#0F0B16;
  --map:#1E1828; --block:#2A2238; --street:#352B47; --shadow:none; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
input,select{font:inherit;color:var(--ink)}
input::placeholder{color:var(--ink-2)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.rhero :focus-visible,.tpanel :focus-visible{outline-color:#fff}
svg{display:block}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;padding:env(safe-area-inset-top,0px) 0 120px;overflow-x:hidden}
@media (min-width:481px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

/* Topbjælke med runde knapper */
.top{display:grid;grid-template-columns:46px minmax(0,1fr) 46px;align-items:center;gap:10px;padding:16px 18px 10px}
.top h1{text-align:center;font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.circ{width:46px;height:46px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;position:relative}
.circ .badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}
.top.dark .circ{background:transparent;border-color:rgba(255,255,255,.24);color:#fff}
.top.dark .circ .badge{border-color:var(--hero)}
.top.dark h1{color:#fff}

/* Forside */
.hhead{display:flex;align-items:center;gap:12px;padding:16px 18px 2px}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto;color:var(--btn);font:inherit;min-width:0}
.logo svg{width:38px;height:38px;flex:none}
.logo span{font:700 29px/1 "Playfair Display",Georgia,"Times New Roman",serif;color:var(--ink)}
.hello{padding:2px 18px 0;color:var(--ink-2);font-size:14px}
.locrow{display:flex;gap:10px;align-items:center;padding:12px 18px 0}
.loc-btn{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;min-width:0;flex:1}
.loc-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-2);flex:none}
.dot.live{background:#2E9E44;animation:pulse 1.8s infinite}
.dot.seek{background:var(--ink);animation:blink 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,158,68,.5)}70%{box-shadow:0 0 0 8px rgba(46,158,68,0)}100%{box-shadow:0 0 0 0 rgba(46,158,68,0)}}
@keyframes blink{50%{opacity:.3}}
.langbtn{height:46px;border-radius:999px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 14px;font-weight:700;font-size:13px;color:var(--ink);flex:none}
.langbtn svg{color:var(--btn)}
.cur-btn{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px;flex:none}
.searchrow{display:flex;gap:10px;padding:14px 18px 0;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 18px;min-width:0;color:var(--ink-2)}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:14px 0;font-size:15px}
.search input:focus{outline:none}
.search:focus-within{border-color:var(--ink)}
.filter{width:52px;height:52px;border-radius:50%;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;flex:none}

.row{display:flex;gap:8px;overflow-x:auto;padding:0 18px 4px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.row.wrap{flex-wrap:wrap}
.chips{padding-top:16px}
.chip{flex:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:11px 22px;font-weight:600;font-size:14px;box-shadow:var(--shadow)}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}

.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 18px 0}
.qa{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px;line-height:1.25;box-shadow:var(--shadow)}
.qa .ic{width:38px;height:38px;border-radius:50%;background:var(--tile);display:grid;place-items:center;flex:none}
.again{padding:12px 18px 0}

.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:30px 18px 12px}
.sec-h h2{font:600 23px/1.15 "Playfair Display",Georgia,serif}
.eyebrow{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin-bottom:4px}
.see{color:var(--ink-2);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}

/* Billedfelter */
.tile{background:var(--tile);border-radius:18px;display:grid;place-items:center;flex:none;position:relative;overflow:hidden}
.tile img{width:82%;height:82%;object-fit:cover;border-radius:50%;box-shadow:0 10px 20px rgba(0,0,0,.18)}
.tile.sq img{width:100%;height:100%;border-radius:0;box-shadow:none}
.tile.s{width:108px;height:108px}
.tile.m{width:112px;align-self:stretch;min-height:126px}
.tile.d{width:100%;aspect-ratio:1}
.tile.l{width:min(78vw,320px);aspect-ratio:1;border-radius:34px}

/* Kort */
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding:0 18px}
.ncard{display:flex;gap:14px;padding:8px;width:100%}
.ncard.dim .tile{opacity:.55}
.body{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;position:relative}
.ncard .body{padding:10px 6px 6px 0}
.nm{display:block;font-size:15px;font-weight:600;max-width:100%;padding-right:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.label{position:absolute;top:10px;right:6px;max-width:42%;color:var(--accent);font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.off{display:block;font-size:27px;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin-top:4px}
.off small{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--ink-2);margin-left:5px}
.kw{display:block;color:var(--ink-2);font-size:13px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mp{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:4px 9px;font-size:12px;font-weight:600;background:var(--card);color:var(--ink);white-space:nowrap}
.mp svg{width:13px;height:13px}
.mp .star{color:var(--accent)}
.mp i{font-style:normal;color:var(--ink-2);font-weight:500}

.ocard{flex:none;width:310px;display:flex;gap:12px;padding:8px}
.ocard .tile{width:112px;min-height:146px;align-self:stretch}
.ocard .tile img{width:94px;height:94px}
.ocard .body{padding:10px 4px 6px 0}
.timer{position:absolute;top:8px;right:2px;display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.ocard .off{margin-top:24px}
.ocard .kw{margin:1px 0 12px}
.pill-btn{background:var(--btn);color:var(--btn-ink);border-radius:999px;padding:10px 20px;font-weight:600;font-size:14px;box-shadow:0 6px 14px rgba(0,0,0,.14)}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 18px}
.dcard{padding:8px;display:flex;flex-direction:column;gap:8px}
.dcard .open{display:flex;flex-direction:column;gap:8px;text-align:left}
.dcard .nm{padding:0 4px;font-size:14px;white-space:normal;line-height:1.3}
.dcard .kw{padding:0 4px;font-size:12px}
.dcard .bot{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:0 4px 4px;margin-top:auto}
.dcard b{font-size:16px;font-weight:700;white-space:nowrap}
.plus{width:38px;height:38px;border-radius:50%;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;flex:none}

.mcard{display:flex;gap:14px;padding:8px}
.mcard .body{padding:10px 4px 6px 0}
.mcard .label{position:static;max-width:100%;margin-bottom:2px}
.mcard .nm{white-space:normal;padding-right:0;text-align:left;line-height:1.3}
.mcard .pr{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em;margin:2px 0 10px}
.mcard .note{color:var(--ink-2);font-size:13px}

.empty{padding:30px 18px;color:var(--ink-2);text-align:center}
.warn{display:block;margin:14px 18px 0;padding:12px 14px;border-radius:16px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:14px;text-align:left;width:calc(100% - 36px)}
.float{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(444px,calc(100% - 36px));z-index:6;background:var(--btn);color:var(--btn-ink);border-radius:999px;padding:16px 24px;font-weight:700;display:flex;justify-content:space-between;gap:10px;box-shadow:0 14px 30px rgba(0,0,0,.25)}

/* Restaurant med mørk top */
.rhero{color:#fff;position:relative;overflow:hidden;padding-bottom:170px}
.rhero::before{content:"";position:absolute;inset:0 0 60px 0;background:var(--hero);z-index:0}
.rhero>*:not(.big){position:relative;z-index:1}
.rhero .desc{padding:10px 22px 0;color:rgba(255,255,255,.86);font-size:15px;line-height:1.5}
.rhero .meta{padding:0 22px;max-width:64%}
.rhero .mp{background:#fff;color:#151515;border-color:#fff}
.rhero .mp i{color:#777}
.rhero .hours{padding:16px 22px 0;color:rgba(255,255,255,.86);font-size:14px;display:flex;gap:6px;align-items:center}
.offbadge{display:inline-block;margin:14px 0 0 22px;background:var(--accent);color:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.rhero .big{position:absolute;right:-64px;bottom:6px;width:260px;height:260px;border-radius:50%;object-fit:cover;z-index:2;box-shadow:0 22px 44px rgba(0,0,0,.45)}
.rhero::after{content:"";position:absolute;left:-35%;right:-35%;bottom:-170px;height:290px;border-radius:50%;background:var(--bg);z-index:1}
.menu-chips{margin-top:-30px;position:relative;z-index:3;padding-top:0}

/* Ret */
.dhero{display:grid;place-items:center;padding:6px 0 22px}
.det{padding:0 22px}
.det h2{font:600 30px/1.15 "Playfair Display",Georgia,serif}
.det .w{color:var(--ink-2);margin-top:4px}
.det .lead{margin-top:10px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tag{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px}
.sep{border-top:1px solid var(--line);margin:22px 0}
.lbl{color:var(--ink-2);font-weight:600;font-size:14px}
.nut{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.nut b{display:block;font-size:20px;font-weight:700}
.nut span{color:var(--ink-2);font-size:13px}
.det h3{font-size:16px;font-weight:700}
.det p.body2{color:var(--ink-2);margin-top:6px;line-height:1.8}
.buybar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(480px,100%);z-index:6;background:var(--card);border-top:1px solid var(--line);padding:12px 18px calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:12px}
.stepper{display:flex;align-items:center;background:var(--tile);border-radius:999px;padding:4px;flex:none}
.stepper button{width:40px;height:44px;display:grid;place-items:center;border-radius:999px}
.stepper b{min-width:24px;text-align:center;font-size:17px;font-weight:700}
.stepper.sm button{width:32px;height:32px}
.stepper.sm b{font-size:15px;min-width:20px}
.primary{flex:1;background:var(--btn);color:var(--btn-ink);border-radius:999px;padding:0 24px;min-height:52px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px}
.primary.center{justify-content:center}
.primary[disabled]{opacity:.4;cursor:not-allowed}

/* Kurv */
.wrap{padding:8px 18px 0;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.ccard{display:flex;gap:14px;padding:8px;align-items:center}
.ccard .tile.s{width:92px;height:92px}
.ccard .body{padding:4px 0}
.ccard .pr{font-weight:700;font-size:18px;margin-top:6px}
.promo{display:flex;gap:10px;padding:10px;align-items:center}
.promo input{flex:1;min-width:0;border:1px solid var(--line);background:var(--tile);border-radius:999px;padding:11px 16px}
.promo button{background:var(--btn);color:var(--btn-ink);border-radius:999px;padding:11px 18px;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--btn);color:var(--btn-ink);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}
.sum{padding:6px 18px}
.sum div{display:flex;justify-content:space-between;gap:10px;padding:11px 0;color:var(--ink-2);font-weight:600}
.sum div+div{border-top:1px solid var(--line)}
.sum .tot{color:var(--ink);font-size:20px;font-weight:800}
.alt{color:var(--ink-2);font-size:13px;text-align:right;margin-top:-4px}
.addr{display:flex;gap:12px;align-items:center;padding:14px 16px;width:100%;text-align:left}
.addr .t{flex:1;min-width:0}
.addr .t b{display:block;font-weight:700}
.addr .t span{color:var(--ink-2);font-size:13px}
.addr .pin{color:var(--accent)}
.bigicon{width:84px;height:84px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 14px;color:var(--ink-2)}

/* Følg ordre */
.map{position:relative;height:60vh;min-height:400px;background:var(--map);overflow:hidden}
.map svg{width:100%;height:100%}
.map .top{position:absolute;inset:0 0 auto;z-index:2}
.gps-pill{position:absolute;top:78px;right:18px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:700;font-size:12px;display:flex;gap:8px;align-items:center;z-index:2}
.tpanel{background:var(--hero);color:#fff;border-radius:30px 30px 0 0;margin-top:-30px;position:relative;z-index:2;padding-bottom:10px}
.tp-top{text-align:center;padding:26px 22px 22px}
.tp-top b{font-size:17px;font-weight:700}
.tp-top p{color:rgba(255,255,255,.8);margin-top:4px}
.tsteps{display:flex;align-items:center;gap:10px;padding:22px 34px;border-top:1px solid rgba(255,255,255,.14);border-bottom:1px solid rgba(255,255,255,.14)}
.tsteps i{flex:1;border-top:3px dotted rgba(255,255,255,.35)}
.tsteps i.on{border-color:#fff}
.ts{color:rgba(255,255,255,.35);flex:none}
.ts.on{color:#fff}
.courier{display:flex;align-items:center;gap:14px;padding:22px}
.avatar{width:54px;height:54px;border-radius:50%;background:#fff;color:#151515;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.courier .t{flex:1}
.courier .t b{display:block;font-weight:700}
.courier .t span{color:rgba(255,255,255,.7);font-size:14px}
.round{width:46px;height:46px;border-radius:50%;background:#fff;color:#151515;display:grid;place-items:center;position:relative;flex:none}
.round .nd{position:absolute;top:-2px;right:-2px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--hero)}
.done-btn{margin:0 22px 22px;width:calc(100% - 44px);background:#fff;color:#151515;border-radius:999px;padding:16px;font-weight:800;text-align:center}

/* Quiz */
.prog{height:8px;border-radius:99px;background:var(--line);margin:2px 18px 0;overflow:hidden}
.prog i{display:block;height:100%;background:var(--btn);border-radius:99px;transition:width .4s ease}
.quiz{padding:26px 18px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.quiz h2{font:600 27px/1.2 "Playfair Display",Georgia,serif;margin-bottom:10px}
.opt-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px 18px;font-weight:600;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:var(--shadow);text-align:left}
.opt-card .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none}
.opt-card[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.opt-card[aria-pressed="true"] .rd{border-color:var(--btn-ink);background:radial-gradient(circle,var(--btn-ink) 0 32%,transparent 38%)}
.quiz.many{grid-template-columns:repeat(2,minmax(0,1fr))}
.quiz.many h2,.quiz.many .q-prev{grid-column:1/-1}
.quiz.many .opt-card{padding:14px;font-size:14px}
.q-prev{justify-self:start;margin-top:6px;padding:8px 0}
.intro{padding:2px 18px 0;color:var(--ink-2);text-align:center}
.qres{padding:8px}
.qres .ncard{padding:0}
.qres .ncard .nm{padding-right:52px}
.why{display:flex;flex-wrap:wrap;gap:6px;padding:12px 4px 0}
.why span{display:inline-flex;align-items:center;gap:5px;background:var(--tile);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600}
.qres .lbl{padding:14px 4px 8px;font-size:13px}
.qres .mcard{background:var(--tile);border:0;box-shadow:none}
.qres .mcard .tile{background:var(--card)}
.qres .see{padding:12px 4px 4px}

/* Valuta */
.conv{margin:8px 18px 18px;padding:18px}
.conv-in{display:flex;gap:10px;margin-top:6px}
.conv-in input{flex:1;min-width:0;font-size:28px;font-weight:800;border:1px solid var(--line);background:var(--tile);border-radius:16px;padding:8px 14px}
.conv-in select{font-weight:700;border:1px solid var(--line);background:var(--tile);border-radius:16px;padding:0 10px}
.rate{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.rate .code{font-weight:800}
.rate .nm2{display:block;color:var(--ink-2);font-size:13px}
.rate .val{text-align:right;font-weight:800;font-size:18px}
.rate .val span{display:block;color:var(--ink-2);font-size:12px;font-weight:600}
.note{color:var(--ink-2);font-size:13px;margin-top:12px}
.ghost-btn{margin:0 18px;width:calc(100% - 36px);background:var(--btn);color:var(--btn-ink);border-radius:999px;padding:16px;font-weight:700;text-align:center}

/* Ark og besked */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:22px 22px calc(24px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.sheet h3{font:600 23px/1.2 "Playfair Display",Georgia,serif;margin-bottom:12px}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 2px;border-top:1px solid var(--line);font-weight:600}
.opt .muted{color:var(--ink-2);font-weight:500;font-size:14px;margin-left:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;background:var(--tile);border-radius:16px;padding:14px 16px;margin:4px 0 14px;font-size:15px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.sheet .primary{width:100%;margin-bottom:10px}
.sec-btn{width:100%;background:var(--tile);border-radius:999px;padding:14px;font-weight:700;margin-bottom:10px;text-align:center}
.errbox{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:11px 18px;border-radius:999px;z-index:30;font-weight:700;font-size:14px;max-width:90vw;text-align:center}
.toast[hidden]{display:none}
/* Spis sammen */
.meet-cta{display:block;width:calc(100% - 36px);margin:16px 18px 0;padding:20px;border-radius:26px;background:linear-gradient(140deg,var(--lav),var(--accent-soft));border:1px solid var(--line);text-align:left}
.meet-cta h2{font:600 22px/1.2 "Playfair Display",Georgia,serif;margin-top:2px}
.meet-cta p{color:var(--ink-2);margin:6px 0 14px;font-size:14px}
.meet-cta .primary{width:100%}
.meet-cta.live{display:flex;align-items:center;gap:14px}
.meet-cta .mt{display:block;font:600 18px/1.25 "Playfair Display",Georgia,serif}
.meet-cta.live .grow{flex:1;min-width:0}
.meet-cta .ic{width:46px;height:46px;border-radius:50%;background:var(--card);color:var(--btn);display:grid;place-items:center;flex:none}
.meet-inline{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:20px;background:linear-gradient(140deg,var(--lav),var(--accent-soft));border:1px solid var(--line);font-weight:600;text-align:left}
.meet-inline .ic{width:38px;height:38px;border-radius:50%;background:var(--card);color:var(--btn);display:grid;place-items:center;flex:none}
.meet-inline span.t{flex:1}
.meet-inline small{display:block;color:var(--ink-2);font-weight:500;font-size:13px}
.mform{padding:18px 18px 0;display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
.mform h3{font-size:15px;font-weight:700;margin-bottom:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--tile);border-radius:999px;padding:4px;margin-bottom:10px}
.seg button{border-radius:999px;padding:11px 8px;font-weight:600;font-size:14px;text-align:center}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:var(--shadow);color:var(--ink)}
.wrapchips{display:flex;flex-wrap:wrap;gap:8px}
.wrapchips .chip{padding:9px 16px;box-shadow:none}
.txtin{width:100%;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:13px 18px}
.txtin:focus{outline:none;border-color:var(--btn)}
.safe{list-style:none;margin:0;padding:16px;border-radius:20px;background:var(--card);border:1px solid var(--line);display:grid;gap:10px}
.safe li{display:flex;gap:10px;align-items:center;font-size:14px}
.safe svg{color:var(--btn);flex:none}
.demo{font-size:12px;color:var(--ink-2);text-align:center;padding:0 18px}
.mh{font:600 25px/1.2 "Playfair Display",Georgia,serif;text-align:center;padding:0 18px}
.radar{width:210px;height:210px;margin:34px auto 18px;border-radius:50%;display:grid;place-items:center;position:relative;color:var(--btn)}
.radar::before,.radar::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--btn);opacity:0;animation:ring 2.4s ease-out infinite}
.radar::after{animation-delay:1.2s}
.radar .core{width:104px;height:104px;border-radius:50%;background:var(--lav);display:grid;place-items:center;border:1px solid var(--line)}
.radar .core svg{width:58px;height:58px}
.radar.still::before,.radar.still::after{animation:none;opacity:0}
@keyframes ring{0%{transform:scale(.48);opacity:.7}100%{transform:scale(1.12);opacity:0}}
.livecount{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:12px;font-weight:600;font-size:14px}
.steps{list-style:none;margin:22px 18px;padding:16px;border-radius:20px;background:var(--card);border:1px solid var(--line);display:grid;gap:10px}
.steps li{display:flex;gap:10px;align-items:center;color:var(--ink-2);font-size:14px}
.steps li svg{opacity:.25}
.steps li.done{color:var(--ink)}
.steps li.done svg{opacity:1;color:var(--btn)}
.mx{width:calc(100% - 36px);margin:0 18px}
.person{display:flex;gap:14px;padding:16px}
.av{width:56px;height:56px;border-radius:50%;background:var(--lav);color:var(--btn);display:grid;place-items:center;font-weight:800;font-size:20px;flex:none;border:2px solid var(--card)}
.person .label{top:2px;right:0}
.person .nm{padding-right:70px;font-size:16px}
.person .why{padding:10px 0 0}
.vb{display:inline-flex;gap:5px;align-items:center;font-size:12px;font-weight:700;color:var(--btn);margin-top:4px}
.vb svg{width:15px;height:15px}
.okhead{text-align:center;padding:10px 18px 4px}
.okic{width:74px;height:74px;border-radius:50%;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;margin:8px auto 14px}
.okic svg{width:34px;height:34px}
.avrow{display:flex;justify-content:center;margin:14px 0 4px}
.avrow .av{margin-left:-10px}
.avrow .av:first-child{margin-left:0}
.avrow .av.me{background:var(--btn);color:var(--btn-ink)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;font-weight:600;font-size:13px;text-align:center}
.act .ic{width:40px;height:40px;border-radius:50%;background:var(--tile);color:var(--btn);display:grid;place-items:center}
.chatcard{padding:16px}
.chatlog{display:grid;gap:8px;margin:10px 0 12px;max-height:260px;overflow:auto}
.msg{max-width:82%;padding:10px 14px;border-radius:18px 18px 18px 6px;background:var(--tile);font-size:14px;justify-self:start}
.msg b{display:block;font-size:12px;color:var(--ink-2)}
.msg.me{justify-self:end;background:var(--btn);color:var(--btn-ink);border-radius:18px 18px 6px 18px}
.chatin{display:flex;gap:8px}
.chatin .circ{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.rate2{display:grid;gap:10px}

/* Fanebjælke */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(480px,100%);z-index:7;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.tabbar[hidden]{display:none}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-2);padding:4px 0}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar button[aria-current="page"] svg{color:var(--btn)}
body.has-tabs .app{padding-bottom:160px}
body.has-tabs .float{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.sec-h.small{padding:24px 18px 10px}
.sec-h.small h2{font-size:19px}

/* Mørkt betalingsdesign (kort, Apple Pay) */
body[data-ui="dark"]{--bg:#1A1027;--card:#24183A;--tile:#2E2148;--lav:#382A55;--ink:#F4EFFB;--ink-2:#B3A6CC;--line:#3B2D57;--btn:#EDE6FA;--btn-ink:#1E1430;--accent:#E7A6CC;--accent-soft:#3A2240;--shadow:none;color-scheme:dark}
.whead{display:flex;align-items:center;gap:10px;padding:20px 18px 12px}
.whead h1{font-size:27px;font-weight:600;margin-right:auto;letter-spacing:-.01em}
.cards-row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 18px 10px;scrollbar-width:none}
.cards-row::-webkit-scrollbar{display:none}
.cslot{flex:0 0 86%;scroll-snap-align:center}
.addslot{border:1.5px dashed var(--line);border-radius:22px;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;aspect-ratio:1.586;color:var(--ink-2);font-weight:600}
.ccv{position:relative;display:block;aspect-ratio:1.586;border-radius:22px;overflow:hidden;color:#fff;
  background:radial-gradient(120% 80% at 92% 0%,rgba(230,230,250,.55),transparent 52%),radial-gradient(80% 90% at 0% 100%,rgba(162,62,114,.6),transparent 56%),linear-gradient(135deg,#2a2335 0%,#0f0d13 55%,#231c2c 100%);
  box-shadow:0 18px 40px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.14)}
.ccv.v1{background:radial-gradient(110% 80% at 90% 0%,rgba(255,170,130,.55),transparent 52%),radial-gradient(80% 90% at 0% 100%,rgba(255,90,54,.45),transparent 56%),linear-gradient(135deg,#2b201d,#0e0c0c 55%,#2a1a16)}
.ccv.v2{background:radial-gradient(110% 80% at 90% 0%,rgba(235,235,245,.45),transparent 52%),radial-gradient(80% 90% at 0% 100%,rgba(140,150,170,.4),transparent 56%),linear-gradient(135deg,#2a2c31,#0d0e10 55%,#24262b)}
.ccv.v3{background:radial-gradient(110% 80% at 90% 0%,rgba(190,170,255,.5),transparent 52%),radial-gradient(80% 90% at 0% 100%,rgba(75,59,107,.8),transparent 56%),linear-gradient(135deg,#251f3a,#0d0b14 55%,#1d1830)}
.ccv::before{content:"";position:absolute;inset:0;background:linear-gradient(118deg,transparent 42%,rgba(255,255,255,.28) 48%,transparent 53%),linear-gradient(160deg,transparent 62%,rgba(255,255,255,.12) 64%,transparent 66%);mix-blend-mode:screen;pointer-events:none}
.cbrand{position:absolute;top:16px;left:20px;font:700 25px/1 "Playfair Display",Georgia,serif}
.nfc{position:absolute;top:16px;right:16px;opacity:.85}
.cchip{position:absolute;left:20px;top:42%;width:42px;height:31px;border-radius:7px;background:linear-gradient(135deg,#e9d9a8,#b99a5b 60%,#efe1b8);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.cchip::after{content:"";position:absolute;inset:7px 12px;border:1px solid rgba(0,0,0,.25);border-radius:3px}
.cnum{position:absolute;left:20px;bottom:56px;font:600 17px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;white-space:nowrap}
.cmeta{position:absolute;left:20px;bottom:15px;display:flex;gap:22px}
.cmeta small{display:block;font-size:9px;letter-spacing:.12em;text-transform:uppercase;opacity:.65}
.cmeta b{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnet{position:absolute;right:18px;bottom:15px}
.visa{font:italic 900 25px/1 Arial,Helvetica,sans-serif;letter-spacing:.02em}
.mc{display:flex}.mc i{width:26px;height:26px;border-radius:50%;background:#EB001B;display:block}.mc i+i{background:#F79E1B;margin-left:-10px;opacity:.92}
.amex{font:800 14px/1 Arial,sans-serif;letter-spacing:.1em;border:2px solid #fff;padding:4px 6px;border-radius:4px}
.dkort{font:800 13px/1 Arial,sans-serif;background:#fff;color:#C8102E;padding:5px 8px;border-radius:5px}
.ccv.frozen{filter:saturate(.25) brightness(.85)}
.frost{position:absolute;inset:0;display:flex;gap:8px;align-items:center;justify-content:center;background:rgba(170,190,230,.22);backdrop-filter:blur(2px);font-weight:700}
.dots{display:flex;justify-content:center;gap:5px;margin:4px 0 14px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:width .2s}
.dots i.on{width:18px;background:var(--ink-2)}
.wacts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 18px}
.wact{display:flex;align-items:center;justify-content:center;gap:6px;padding:13px 6px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13px}
.wact[aria-pressed="true"]{color:var(--accent)}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:14px 18px 0}
.applerow{display:flex;align-items:center;gap:12px}
.applerow .t{flex:1;min-width:0}
.applerow .t b{display:block}
.applerow .t small{color:var(--ink-2);font-size:13px}
.aplogo{display:inline-flex;align-items:center;background:#000;color:#fff;border-radius:9px;padding:7px 11px;font-weight:600;font-size:14px;border:1px solid #3a3a3a;white-space:nowrap}
.pillsm{border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;white-space:nowrap}
.pillsm.on{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.spend .sh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.spend small{color:var(--ink-2);font-size:13px}
.spend .big{display:block;font-size:30px;font-weight:600;letter-spacing:-.02em}
.trend{font-size:12px;font-weight:700;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:5px 10px}
.chart{display:block;width:100%;height:auto;margin-top:10px}
.daylbl{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.daylbl span{text-align:center;font-size:12px;color:var(--ink-2);background:var(--tile);border-radius:999px;padding:5px 0}
.daylbl span.on{background:var(--btn);color:var(--btn-ink)}
.wtiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 18px 0}
.wtiles .wcard{margin:0}
.tile2 small{display:block;color:var(--ink-2);font-size:12px}
.tile2 b{font-size:22px;font-weight:600}
.arow{display:flex;align-items:center;gap:12px;padding:10px}
.tile.xs{width:48px;height:48px;border-radius:14px}
.amt{font-weight:700;white-space:nowrap}
.emptycard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;margin:6px 18px 0;width:calc(100% - 36px);aspect-ratio:1.586;border:1.5px dashed var(--line);border-radius:22px;color:var(--ink-2);text-align:center;padding:10px}
.emptycard b{color:var(--ink)}
.emptycard .ic{width:52px;height:52px;border-radius:50%;background:var(--tile);display:grid;place-items:center;color:var(--ink)}
.cprev{padding:4px 18px 12px}
.cform,.aform,.eform{display:grid;gap:14px}
.cform{padding:6px 18px 0}
.fld{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.fld .txtin{font-size:16px;color:var(--ink);font-weight:500}
.fld .txtin[readonly]{opacity:.6}
.ferr{font-style:normal;color:var(--accent);font-size:12px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600}
.chk input{width:20px;height:20px;accent-color:var(--btn);flex:none}
.tgl{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;font-weight:600;font-size:14px;cursor:pointer;position:relative}
.tgl input{position:absolute;opacity:0;width:1px;height:1px}
.tgl i{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.tgl i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.tgl input:checked+i{background:var(--btn)}
.tgl input:checked+i::after{transform:translateX(18px);background:var(--btn-ink)}
.tgl input:focus-visible+i{outline:2px solid var(--ink);outline-offset:2px}
.applepay-btn{width:100%;min-height:54px;border-radius:14px;background:#000;color:#fff;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid #3a3a3a}
.applepay-btn[disabled]{opacity:.4}
.aph{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.aptot{display:flex;justify-content:space-between;align-items:baseline;padding:2px 2px 16px;font-weight:600}
.aptot b{font-size:26px}
.apconfirm{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px;border-radius:18px;background:var(--tile);font-weight:600;margin-bottom:10px}
.apconfirm svg{color:var(--btn)}
.paying{text-align:center;padding:24px 0 12px}
.spin{width:46px;height:46px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--btn);margin:0 auto 16px;animation:spin .9s linear infinite}
.okmark{width:64px;height:64px;border-radius:50%;background:#2E9E44;color:#fff;display:grid;place-items:center;margin:0 auto 14px}
.okmark svg{width:30px;height:30px}
@keyframes spin{to{transform:rotate(360deg)}}
.circ.sm{width:36px;height:36px}

/* Profil og login */
.phead{padding:20px 18px 6px}
.ptitle{font:600 28px/1.1 "Playfair Display",Georgia,serif}
.pcard{display:flex;gap:14px;align-items:center;padding:16px;margin:8px 18px 0}
.av.big{width:66px;height:66px;font-size:23px}
.pname{font-size:18px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 18px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 6px;text-align:center}
.stat b{display:block;font-size:22px}
.stat small{color:var(--ink-2);font-size:12px}
.mlist{margin:14px 18px 0;padding:4px 16px}
.mlist h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);padding:12px 0 2px}
.prow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;text-align:left}
.prow+.prow,.mlist .tgl+.tgl{border-top:1px solid var(--line)}
.prow .ic{width:38px;height:38px;border-radius:12px;background:var(--tile);display:grid;place-items:center;color:var(--btn);flex:none}
.prow .t{flex:1;min-width:0}
.prow b{display:block;font-weight:600}
.prow small{display:block;color:var(--ink-2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow>svg{color:var(--ink-2);flex:none}
.danger{display:block;width:calc(100% - 36px);margin:10px 18px 0;padding:14px;border-radius:999px;color:var(--accent);font-weight:700;text-align:center;border:1px solid var(--line)}
.auth{padding:26px 18px 0;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.alogo{width:74px;height:74px;margin:0 auto;color:var(--btn)}
.alogo svg{width:100%;height:100%}
.auth .seg{margin:0}
.pwbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.pwbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.pwbar[data-s="3"] i,.pwbar[data-s="4"] i{background:#2E9E44}
.pwwrap{position:relative;display:block}
.pwwrap .txtin{padding-right:78px}
.pwshow{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:700;color:var(--btn);padding:6px 10px}
.linkbtn{justify-self:end;font-size:13px;font-weight:700;color:var(--btn)}
.ordcard{padding:12px;display:grid;gap:10px}
.ordtop{display:flex;gap:12px;align-items:center}
.ordtop .body{flex:1;min-width:0}
.orditems{color:var(--ink-2);font-size:13px}
.ordbtns{display:flex;gap:8px}
.ordbtns button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:11px;border-radius:999px;font-weight:700;font-size:13px;background:var(--tile);text-align:center}
.ordbtns button.dark{background:var(--btn);color:var(--btn-ink)}

/* Anmeldelser */
.rvsum{display:flex;gap:18px;align-items:center;padding:16px;margin:0 18px}
.rvbig{text-align:center;flex:none}
.rvbig b{display:block;font-size:40px;font-weight:700;line-height:1;margin-bottom:4px}
.stars{display:inline-flex;gap:1px;color:var(--line)}

/* Kortvisning */
body.on-map .app{padding-bottom:0}

.lmap{position:absolute;inset:0;background:var(--map)}
.svgmap{width:100%;height:100%;display:block}

.mpin{width:44px;height:44px;border-radius:50%;border:3px solid #fff;overflow:hidden;box-shadow:0 4px 12px rgba(42,33,64,.35);background:var(--lav);position:relative;transition:transform .15s}

.mpin span{display:none}
.mpin.sel{border-color:var(--accent);transform:scale(1.25);z-index:5}
.mme{width:22px;height:22px;border-radius:50%;background:#2E7DF6;border:4px solid #fff;box-shadow:0 0 0 8px rgba(46,125,246,.2)}

.mshandle{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.mshead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.mlrow{padding:0 0 4px}
.mlcard{flex:none;width:132px;padding:8px;display:flex;flex-direction:column;gap:6px;text-align:left;box-shadow:none}
.mlcard .tile.xs{width:100%;height:72px;border-radius:12px}
.mlcard .nm{font-size:13px;padding-right:0;white-space:normal;line-height:1.25}
.mlcard .kw{font-size:12px}
.mscard{display:flex;gap:12px;align-items:flex-start}
.mscard .body{flex:1;min-width:0}
.msbtns{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin-top:12px}
.msbtns .sec-btn{margin:0}
.dirhead{display:flex;gap:10px;align-items:center}
.dirhead .body{flex:1;min-width:0;display:grid;gap:2px}
.dirhead .kw{white-space:normal}
.dirhead b{color:var(--ink)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 10px}
.modes button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:16px;border:1px solid var(--line);font-size:12px;color:var(--ink-2)}
.modes button b{font-size:15px;color:var(--ink)}
.modes button[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.modes button[aria-pressed="true"] b{color:var(--btn-ink)}
.dsum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:4px 0 8px}
.dsum b{font-size:26px;font-weight:700}
.dsum span{color:var(--ink-2);font-size:14px}
.steps2{list-style:none;margin:6px 0 10px;padding:0;display:grid;gap:0}
.steps2 li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;position:relative}
.steps2 li+li{border-top:1px dashed var(--line)}
.steps2 b{display:block;font-size:14px}
.steps2 small{display:block;color:var(--ink-2);font-size:13px}
.sic{width:34px;height:34px;border-radius:50%;background:var(--tile);display:grid;place-items:center;flex:none;color:var(--btn)}
.lbadge{min-width:34px;height:34px;border-radius:9px;color:#fff;font-weight:800;font-size:12px;display:grid;place-items:center;flex:none;padding:0 4px}
.dlinks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.dlinks .sec-btn{margin:0;text-decoration:none;color:var(--ink);font-size:13px;display:flex;align-items:center;justify-content:center}

/* Madpas */
.passbanner{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:left}

.passbanner b{display:block;font-size:14px}
.bar{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar b{display:block;height:100%;background:var(--btn);border-radius:3px}

.pown{opacity:.85;font-size:14px}

function dist(a,b){const R=6371,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dn=r(b.lng-a.lng);
  const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function info(r){

  const km=dist(S.loc,r);return {km,walk:Math.round(km*1000/80),inRange:true};
}

function nutri(it){if(it.nu)return it.nu;let h=0;for(const c of it.n)h=(h*31+c.charCodeAt(0))>>>0;
  const k=it.t.includes("drik")?40+h%60:it.t.includes("let")?110+h%80:190+h%120;
  return [k,+(3+(h%120)/10).toFixed(1),+(2+((h>>>4)%130)/10).toFixed(1),+(6+((h>>>8)%280)/10).toFixed(1)];}
function cartData(){
  const r=RESTAURANTS.find(x=>x.id===S.cart.rid);
  if(!r) return {r:null,lines:[],sub:0,count:0};
  const lines=Object.entries(S.cart.items).map(([id,q])=>({it:byId(id),q})).filter(l=>l.it&&l.q>0);
  return {r,lines,sub:lines.reduce((a,l)=>a+l.it.p*l.q,0),count:lines.reduce((a,l)=>a+l.q,0)};
}

function nearestArea(p){return AREAS.slice().sort((a,b)=>dist(p,a)-dist(p,b))[0];}
function gpsPolicy(){try{const p=document.permissionsPolicy||document.featurePolicy;if(p&&p.allowsFeature)return p.allowsFeature("geolocation");}catch(e){}return null;}
function embedded(){try{return window.self!==window.top;}catch(e){return true;}}
const BLOCKED_MSG="GPS'en er spærret i denne visning, fordi appen vises inde i en anden side. Åbn appen i sin egen fane på https://preppya.github.io/seated/, så virker GPS'en. Indtil da kan du vælge dit område nedenfor.";
const DENIED_MSG="Adgang til lokation blev afvist. Tillad placering for browseren i telefonens indstillinger (iPhone: Anonymitet og sikkerhed → Lokalitetstjenester → Safari-websteder; Android: Indstillinger → Placering → Chrome) og for siden i browseren. Prøv så igen.";
async function gpsDiag(){
  const d={secure:window.isSecureContext,api:"geolocation" in navigator,policy:gpsPolicy(),embedded:embedded(),perm:"ukendt"};
  try{if(navigator.permissions){const q=await navigator.permissions.query({name:"geolocation"});d.perm=q.state;}}catch(e){}
  S.diag=d;return d;
}
function gpsLabel(){
  if(S.gps.blocked&&!S.loc) return "GPS virker ikke i denne visning – tryk for hjælp";
  if(S.gps.status==="seeking"&&!S.loc) return "Finder din GPS-position …";
  if(!S.loc) return "Slå GPS til for at finde dig";
  return S.loc.label;
}
function startGps(){
  if(!("geolocation" in navigator)){S.gps={status:"error",err:"Denne browser har ikke adgang til enhedens GPS."};render();return;}
  if(!window.isSecureContext){S.gps={status:"error",err:"GPS kræver en sikker forbindelse (https)."};render();return;}
  if(gpsPolicy()===false){S.gps={status:"error",err:BLOCKED_MSG,blocked:true};render();gpsSheet();return;}
  stopGps(true);
  S.gps={status:"seeking",err:"",at:null};render();
  S.watchId=navigator.geolocation.watchPosition(pos=>{
    const c=pos.coords,p={lat:c.latitude,lng:c.longitude,acc:Math.round(c.accuracy),speed:c.speed,heading:c.heading,alt:c.altitude};
    const near=nearestArea(p);
    p.label=dist(p,near)<5?`Nær ${near.name}`:`${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}`;
    S.loc=p;S.gps={status:"live",err:"",at:Date.now()};save();
    if(!$("#sheetBg").hidden && $("#sheet").dataset.kind==="gps") gpsSheet(); else if(S.view==="map") mapUserUpdate(); else softRender();
  },err=>{
    stopGps(true);
    S.gps={status:"error",blocked:err.code===1&&embedded()&&gpsPolicy()!==true,err:err.code===1
      ?(embedded()&&gpsPolicy()!==true?BLOCKED_MSG:DENIED_MSG)
      :err.code===3?"GPS'en svarede ikke i tide. Gå evt. udendørs eller tæt på et vindue, og prøv igen."
      :"Positionen kunne ikke bestemmes. Tjek at lokationstjenester er slået til på enheden."};
    render();gpsSheet();
  },{enableHighAccuracy:true,maximumAge:0,timeout:20000});
}
function stopGps(silent){
  if(S.watchId!==null){try{navigator.geolocation.clearWatch(S.watchId);}catch(e){}}
  S.watchId=null;
  if(!silent){S.gps={status:"off",err:"",at:null};if(S.loc&&!S.loc.manual)S.loc={...S.loc,manual:true,label:S.loc.label};save();render();}
}
function setArea(a){stopGps(true);S.gps={status:"off",err:"",at:null};S.loc={lat:a.lat,lng:a.lng,label:a.name,manual:true};save();closeSheet();render();}
function gpsSheet(){

/* ---------- Bordbooking ----------
   Seated finder restauranter, viser menuer og booker bord. Det er gratis at booke, og man betaler på restauranten
   – eller betaler og deler regningen i appen bagefter. Nogle steder kræver et kort som garanti mod udeblivelse.
   Demo: restauranterne er opdigtede, og bookinger gemmes kun på denne enhed. */
const GUAR={bistro:200,sushi:150,tapas:100,smorrebrod:100,seoul:100};
const guarOf=r=>GUAR[r.id]||0;
const pad2=n=>String(n).padStart(2,"0");
const dKey=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const bkDate=b=>new Date(`${b.date}T${b.time}:00`);
function hoursOf(r){const m=r.hours.match(/(\d+):(\d+)\s*–\s*(\d+):(\d+)/);return m?[+m[1]*60+ +m[2],+m[3]*60+ +m[4]]:[660,1320];}
function slotsFor(r,date){
  const [o,c]=hoursOf(r),out=[],now=new Date(),today=date===dKey(now),nm=now.getHours()*60+now.getMinutes();
  for(let t=Math.ceil(o/30)*30;t<=c-90;t+=30){const time=`${pad2(Math.floor(t/60))}:${pad2(t%60)}`;let h=0;for(const ch of r.id+date+time)h=(h*31+ch.charCodeAt(0))>>>0;
    out.push({time,past:today&&t<nm+30,full:h%5===0});}
  return out;}
function dayLabel(key){const d=new Date(key+"T12:00:00"),tm=new Date();tm.setDate(tm.getDate()+1);
  if(key===dKey(new Date()))return "I dag";if(key===dKey(tm))return "I morgen";
  return d.toLocaleDateString(LOC(),{weekday:"short",day:"numeric",month:"short"});}
const upcoming=()=>S.bookings.filter(b=>["confirmed","seated"].includes(b.status)&&bkDate(b).getTime()>Date.now()-4*3600e3).sort((a,b)=>bkDate(a)-bkDate(b));
const bkWhen=b=>`<span>${esc(dayLabel(b.date))}</span> · <span translate="no">${b.time}</span>`;
const lastVisit=()=>{const b=S.bookings.find(x=>x.status==="paid");return b?RESTAURANTS.find(r=>r.id===b.rid):null;};
const BK_ST={confirmed:"Bekræftet",seated:"Ankommet",paid:"Betalt",cancelled:"Aflyst"};
function bookStart(rid,editId){
  const ed=editId&&S.bookings.find(b=>b.id===editId);
  S.bk=ed?{rid:ed.rid,date:ed.date,time:ed.time,people:ed.people,note:ed.note,edit:ed.id}:{rid,date:dKey(new Date()),time:"",people:2,note:"",edit:null};
  go("book");}
function vBook(){
  const f=S.bk;if(!f){S.view="home";return vHome();}
  const r=RESTAURANTS.find(x=>x.id===f.rid),g=guarOf(r),m=payMethod();
  const days=[...Array(14)].map((_,k)=>{const d=new Date();d.setDate(d.getDate()+k);return dKey(d);});
  const slots=slotsFor(r,f.date).filter(x=>!x.past),free=slots.filter(x=>!x.full);
  if(f.time&&!free.some(x=>x.time===f.time))f.time="";
  return `${topbar({title:f.edit?"Ændr booking":"Book bord",cart:false})}
   <section class="card bkhead">${tileR(r,"xs")}<div class="body"><span class="nm" style="padding-right:0">${esc(r.name)}</span><span class="kw">${esc(r.kw)}</span><span class="kw">Åbent ${esc(r.hours)}</span></div></section>

/* ---------- Betal regningen ----------
   Når man er ankommet, kan man betale regningen i appen og dele den med de andre ved bordet.
   Demo: regningen laves ud fra antal personer og stedets menu. Rigtig betaling kræver, at restaurantens kassesystem sender regningen til appen. */
const TIPS=[0,.05,.1,.15];
function billItems(b){
  const items=ALL.filter(it=>it.r.id===b.rid),drinks=items.filter(it=>it.t.includes("drik")),food=items.filter(it=>!it.t.includes("drik"));
  let h=0;for(const ch of b.code)h=(h*31+ch.charCodeAt(0))>>>0;
  const q={},add=it=>{if(it)q[it.id]=(q[it.id]||0)+1;};
  for(let i=0;i<b.people;i++){add(food[(h+i*7)%food.length]);if(drinks.length)add(drinks[(h+i*3)%drinks.length]);}
  if(b.people>1)add(food[(h+5)%food.length]);
  return Object.entries(q).map(([id,n])=>({it:byId(id),q:n}));
}
function billTotals(b){
  const r=RESTAURANTS.find(x=>x.id===b.rid),lines=billItems(b),sub=lines.reduce((a,l)=>a+l.it.p*l.q,0),bl=S.bill||{tip:0,ways:1,split:[]};
  const rdisc=Math.round(sub*(r.off||0)),disc=S.promo?Math.round(sub*PROMOS[S.promo]):0,v=activeVoucher(r),vdisc=v?Math.round(sub*v.pct):0,fdisc=firstBuy()?Math.round(sub*FIRST_PCT):0;
  const tip=Math.round(sub*bl.tip),total=Math.max(0,sub-rdisc-disc-vdisc-fdisc+tip),ways=Math.max(1,bl.ways);
  const share=Math.round(total/ways),gdisc=S.useGift!==false?Math.min(S.giftBal||0,share):0;
  return {r,lines,sub,rdisc,disc,v,vdisc,fdisc,tip,total,ways,share,gdisc,pay:share-gdisc};
}

// Hvilke anledninger passer hvert sted til
const OCC={bowl:["alene","date"],pho:["alene","venner"],pizza:["venner","familie","date"],burger:["alene","venner","familie"],smorrebrod:["date","familie"],sushi:["date","venner"],kebab:["venner","familie"],

// Giver hvert sted point ud fra svarene og finder stedets bedste ret
function quizRank(){
  const A=S.quiz.a;
  const dishMax=(A.mood?3:0)+(A.prot?3:0)+(A.hot==="ja"?2:0)+(A.hunger?2:0)+(A.bud?2:0);
  const dish=it=>{const t=it.t;let s=0;const why=[];
    if(t.includes("drik")&&A.mood!=="sød") return null;
    if(A.prot==="veg"&&!t.includes("veg")) return null;
    if(A.hot==="nej"&&t.includes("stærk")) return null;
    if(A.mood&&t.includes(A.mood)){s+=3;why.push({let:"Let ret",mæt:"Mættende ret",sød:"Noget sødt"}[A.mood]);}
    if(A.prot&&t.includes(A.prot)){s+=3;why.push({kød:"Med kød",fisk:"Med fisk",veg:"Plantebaseret"}[A.prot]);}
    if(A.hot==="ja"&&t.includes("stærk")){s+=2;why.push("Stærk");}
    if(A.hunger==="snack"&&(it.g<=220||t.includes("let"))){s+=2;why.push("Passer til lille sult");}
    else if(A.hunger==="stor"&&t.includes("mæt")&&it.g>=300){s+=2;why.push("Stor portion");}
    else if(A.hunger==="måltid"&&it.g>=200&&!t.includes("drik")){s+=2;}
    const p=it.p;
    if((A.bud==="lav"&&p<80)||(A.bud==="mid"&&p>=80&&p<=125)||(A.bud==="høj"&&p>=110)){s+=2;why.push("Inden for budget");}
    return {it,s,why};};
  return RESTAURANTS.map(r=>{
    const i=info(r),why=[];let s=0,max=dishMax;
    if(A.cuisine){max+=4;if(r.cat===A.cuisine){s+=4;why.push(catTxt(r.cat));}}
    if(A.occ){max+=2;if(OCC[r.id].includes(A.occ)){s+=2;why.push(OCC_TXT[A.occ]);}}
    if(A.near==="naer"&&S.loc){max+=2;if(i.walk<=15){s+=2;why.push(`${i.walk} min. gang herfra`);}else if(i.walk<=25)s+=1;}
    const best=r.menu.flatMap(m=>m.items).map(dish).filter(Boolean).sort((a,b)=>(b.s-a.s)||(a.it.p-b.it.p))[0];
    let p=max?Math.round((s+(best?best.s:0))/max*100):80;
    if(!best)p=Math.min(p,25);
    if(r.off)why.push(`${pct(r.off)} % rabat i dag`);
    return {r,i,pct:Math.min(p,99),why:why.concat(best?best.why:[]),best,ok:r.open};
  }).sort((a,b)=>(b.ok-a.ok)||(b.pct-a.pct)||(b.r.off-a.r.off)||((a.i.km||0)-(b.i.km||0)));
}

/* ---------- Spis sammen (møde-algoritme) ----------
   Matcher en solospiser med andre solospisere ud fra HVOR de vil spise, HVORNÅR, gruppestørrelse og stemning.
   Demo: de andre profiler er opdigtede og genereres lokalt. Rigtig realtidsmatch mellem brugere kræver en server. */
const SLOTS=["17:30","18:00","18:30","19:00","19:30","20:00","20:30"];
const TALK={snak:"Snakker gerne meget",rolig:"Hyggeligt og roligt",sprog:"Øver gerne et nyt sprog"};
const MEET_NAMES=["Sofie","Mads","Aisha","Jonas","Freja","Ali","Clara","Oliver","Maja","Emil","Nora","Lucas","Ida","Elias","Yasmin","Mikkel","Laura","Tobias","Sara","Ahmed","Signe","Kasper","Lea","Omar","Anna","Felix","Mathilde","Jakob","Amira","Rasmus","Hannah","Victor","Nadia","Simon","Julie","Karim",
  "Astrid","Malthe","Leila","Frederik","Cecilie","Noah","Zainab","Magnus","Emma","Hassan","Josefine","William","Mira","Christian","Selma","Anton","Fatima","Sebastian","Alberte","Daniel","Iben","Marcus","Rosa","Peter"];
const MEET_BIOS=["Ny i København","Arbejder hjemmefra og savner selskab","Studerer på KU","Elsker at prøve nye køkkener","På forretningsrejse i byen","Er lige flyttet til byen","Går gerne en tur efter maden","Laver selv mad, men vil ud i aften","Underviser i dansk","Sygeplejerske med fri i aften"];
const SEARCH_MS=4500;
const slotMin=t=>{const [h,m]=t.split(":").map(Number);return h*60+m;};
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
// Dagens demo-solospisere – de samme hele dagen, nye i morgen
function demoPool(){
  const d=new Date(),r=rng(d.getFullYear()*1000+d.getMonth()*40+d.getDate()),pick=a=>a[Math.floor(r()*a.length)];
  const open=RESTAURANTS.filter(x=>x.open);
  return MEET_NAMES.map((n,i)=>({id:"p"+i,name:n,age:21+Math.floor(r()*42),bio:pick(MEET_BIOS),rid:pick(open).id,slot:pick(SLOTS),size:r()<.55?2:4,talk:pick(Object.keys(TALK)),verified:r()<.85}));
}
function newMeet(where){return {status:"setup",wmode:where&&where.type==="a"?"a":"r",where:where||null,slot:null,size:2,talk:"snak",name:S.meet&&S.meet.name||"",skip:[],chat:[]};}
function meetPlace(w){
  if(!w)return null;
  if(w.type==="r"){const r=RESTAURANTS.find(x=>x.id===w.id);return r?{label:r.name,lat:r.lat,lng:r.lng}:null;}
  const a=AREAS[w.i];return a?{label:a.name,lat:a.lat,lng:a.lng}:null;
}
function slotsToday(){const now=new Date(),n=now.getHours()*60+now.getMinutes();const t=SLOTS.filter(s=>slotMin(s)>=n+20);
  return t.length?{list:t,day:"i aften"}:{list:SLOTS,day:"i morgen aften"};}
const listNames=a=>a.length<2?a.join(""):a.slice(0,-1).join(", ")+" og "+a[a.length-1];
// Point for hvor godt en anden solospiser passer. null = passer ikke.
function meetScore(p,m){
  const why=[],pr=RESTAURANTS.find(x=>x.id===p.rid);let s=0;
  if(m.where.type==="r"){
    const mine=RESTAURANTS.find(x=>x.id===m.where.id);
    if(p.rid===mine.id){s+=50;why.push("Vil spise samme sted");}
    else{const km=dist(pr,mine);if(km<1.2){s+=28;why.push(`Vil spise ${kmTxt(km)} derfra`);}else if(km<2.5){s+=12;why.push(`Vil gerne spise i nærheden (${kmTxt(km)})`);}else return null;}
  }else{
    const a=AREAS[m.where.i],km=dist(pr,a);
    if(km<1.5){s+=45;why.push(`Vil spise i ${a.name}`);}else if(km<3){s+=22;why.push(`Vil spise tæt på ${a.name}`);}else return null;
  }
  const dt=Math.abs(slotMin(p.slot)-slotMin(m.slot));
  if(dt===0){s+=30;why.push(`Samme tidspunkt · kl. ${m.slot}`);}else if(dt<=30){s+=18;why.push(`Ville spise kl. ${p.slot}`);}else if(dt<=60)s+=6;else return null;
  if(p.talk===m.talk){s+=10;why.push(TALK[m.talk]);}
  if(p.size===m.size)s+=10;
  if(p.verified)s+=5;
  return {p,s,why};
}
function findMatch(m){
  const scored=demoPool().filter(p=>!m.skip.includes(p.id)).map(p=>meetScore(p,m)).filter(Boolean).sort((a,b)=>b.s-a.s);
  if(!scored.length)return null;
  const group=scored.slice(0,m.size===2?1:3);
  let rid=m.where.type==="r"?m.where.id:null;
  if(!rid){const c={};group.forEach(g=>c[g.p.rid]=(c[g.p.rid]||0)+g.s);rid=Object.keys(c).sort((a,b)=>c[b]-c[a])[0];}
  return {rid,slot:m.slot,people:group.map(g=>({...g.p,why:g.why,score:Math.min(99,Math.round(g.s/105*100))}))};
}
function startMeetSearch(){
  const m=S.meet,sl=slotsToday(),pl=meetPlace(m.where);
  m.day=sl.day;m.status="searching";m.t0=Date.now();m.match=null;m.chat=[];
  m.count=demoPool().filter(p=>{const r=RESTAURANTS.find(x=>x.id===p.rid);return dist(r,pl)<3&&Math.abs(slotMin(p.slot)-slotMin(m.slot))<=60&&!m.skip.includes(p.id);}).length;
  save();render();window.scrollTo(0,0);
}
function resolveMeet(){
  const m=S.meet,res=findMatch(m);
  if(res){m.match=res;m.status="found";}else m.status="none";
  save();
  if(S.view==="meet")render();else{toast(res?"Spis sammen: vi har fundet et match":"Spis sammen: ingen match lige nu");if(S.view==="home")softRender();}
}

/* ---------- Konto: opret profil, log ind, log ud ----------
   Demo: profiler gemmes kun på denne enhed (localStorage). Adgangskoder gemmes aldrig i klartekst – kun som SHA-256-hash med salt.
   En rigtig app skal have en server med sikkert login (fx Sign in with Apple eller MitID) i stedet for localStorage. */
const ACC_KEY="gaffel-accounts";
function accounts(){try{return JSON.parse(localStorage.getItem(ACC_KEY)||"{}");}catch(e){return {};}}
function saveAccounts(a){try{localStorage.setItem(ACC_KEY,JSON.stringify(a));}catch(e){}}
const me=()=>S.user?accounts()[S.user]||null:null;
async function hashPw(pw,salt){
  const data=new TextEncoder().encode(salt+":"+pw);
  try{const buf=await crypto.subtle.digest("SHA-256",data);return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");}
  catch(e){let h=5381;for(const c of data)h=((h<<5)+h+c)>>>0;return "x"+h.toString(16);}
}
const EMAIL_RX=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
function pwStrength(p){let s=0;if(p.length>=8)s++;if(p.length>=12)s++;if(/[a-zæøå]/.test(p)&&/[A-ZÆØÅ]/.test(p))s++;if(/\d/.test(p))s++;if(/[^A-Za-z0-9æøåÆØÅ]/.test(p))s++;return Math.min(4,s);}
const PW_TXT=["For svag","Svag","OK","God","Stærk"];
const initialsOf=a=>((a.fname||"?")[0]+((a.lname||"")[0]||"")).toUpperCase();
const pwOk=pw=>pw.length>=8&&/\d/.test(pw)&&/[A-Za-zÆØÅæøå]/.test(pw);
async function doSignup(){
  const f=S.form,err={};
  const fname=(f.fname||"").trim(),lname=(f.lname||"").trim(),email=(f.email||"").trim().toLowerCase(),phone=(f.phone||"").trim(),pw=f.pw||"";
  if(fname.length<2)err.fname="Skriv dit fornavn";
  if(!EMAIL_RX.test(email))err.email="Skriv en gyldig e-mail";
  else if(accounts()[email])err.email="Der findes allerede en profil med denne e-mail";
  if(phone&&!/^\+?[\d ]{8,16}$/.test(phone))err.phone="Skriv et gyldigt telefonnummer";
  if(!pwOk(pw))err.pw="Mindst 8 tegn med både bogstaver og tal";
  if(!f.terms)err.terms="Du skal acceptere vilkårene";
  S.authErr=err;if(Object.keys(err).length){keepScroll();return;}
  const salt=Math.random().toString(36).slice(2,12),hash=await hashPw(pw,salt);
  const a=accounts();a[email]={fname,lname,email,phone,salt,hash,created:Date.now()};saveAccounts(a);
  S.user=email;S.form={};S.authErr={};S.showPw=false;save();render();window.scrollTo(0,0);toast(`Velkommen, ${fname}!`);
}
async function doLogin(){
  const f=S.form,email=(f.email||"").trim().toLowerCase(),pw=f.pw||"";
  if(S.lockUntil&&Date.now()<S.lockUntil){S.authErr={form:"For mange forsøg. Vent 30 sekunder, og prøv igen."};keepScroll();return;}
  const a=accounts()[email];
  if(!a||(await hashPw(pw,a.salt))!==a.hash){
    S.tries=(S.tries||0)+1;if(S.tries>=5){S.lockUntil=Date.now()+30000;S.tries=0;}
    S.authErr={form:"Forkert e-mail eller adgangskode"};keepScroll();return;}
  S.tries=0;S.user=email;S.form={};S.authErr={};S.showPw=false;save();render();window.scrollTo(0,0);toast(`Velkommen tilbage, ${a.fname}!`);
}
async function saveProfile(){
  const a=me();if(!a)return;const f=S.form,err={};
  const fname=(f.fname||"").trim(),lname=(f.lname||"").trim(),phone=(f.phone||"").trim();
  if(fname.length<2)err.fname="Skriv dit fornavn";
  if(phone&&!/^\+?[\d ]{8,16}$/.test(phone))err.phone="Skriv et gyldigt telefonnummer";
  if(f.newpw){if(!f.curpw||(await hashPw(f.curpw,a.salt))!==a.hash)err.curpw="Den nuværende adgangskode er forkert";if(!pwOk(f.newpw))err.newpw="Mindst 8 tegn med både bogstaver og tal";}
  S.authErr=err;if(Object.keys(err).length){keepScroll();return;}
  const all=accounts();Object.assign(all[a.email],{fname,lname,phone});
  if(f.newpw){all[a.email].salt=Math.random().toString(36).slice(2,12);all[a.email].hash=await hashPw(f.newpw,all[a.email].salt);}
  saveAccounts(all);S.form={};back();toast(f.newpw?"Oplysninger og adgangskode er gemt":"Dine oplysninger er gemt");
}

/* ---------- Betaling: kort og Apple Pay ----------
   Demo: der trækkes ingen penge. Fulde kortnumre og CVC gemmes aldrig – kun mærke, de sidste 4 cifre, navn og udløbsdato.
   Rigtige betalinger kræver en betalingsudbyder (fx Stripe, Adyen eller Nets) og et Apple Pay-merchant-ID. */
const BRAND={visa:"Visa",mc:"Mastercard",amex:"American Express",dk:"Dankort",card:"Betalingskort"};
function detectBrand(n){return /^5019/.test(n)?"dk":/^4/.test(n)?"visa":/^(5[1-5]|2[2-7])/.test(n)?"mc":/^3[47]/.test(n)?"amex":"card";}
function luhn(n){let s=0,alt=false;for(let i=n.length-1;i>=0;i--){let d=+n[i];if(alt){d*=2;if(d>9)d-=9;}s+=d;alt=!alt;}return s%10===0;}
const fmtNum=(d,b)=>b==="amex"?[d.slice(0,4),d.slice(4,10),d.slice(10,15)].filter(Boolean).join(" "):(d.match(/.{1,4}/g)||[]).join(" ");
const netLogo=b=>b==="visa"?`<span class="visa" translate="no">VISA</span>`:b==="mc"?`<span class="mc" aria-label="Mastercard"><i></i><i></i></span>`:b==="amex"?`<span class="amex" translate="no">AMEX</span>`:b==="dk"?`<span class="dkort" translate="no">Dankort</span>`:"";
function applePayAvailable(){try{return !!(window.ApplePaySession&&ApplePaySession.canMakePayments());}catch(e){return false;}}

const DAYS=["Søn","Man","Tir","Ons","Tor","Fre","Lør"];
function spendWeek(){
  const now=new Date(),start=new Date(now);start.setHours(0,0,0,0);start.setDate(start.getDate()-start.getDay());
  const prev=start.getTime()-7*86400e3,days=[0,0,0,0,0,0,0];let total=0,last=0;
  for(const o of S.orders){if(o.at>=start.getTime()){days[new Date(o.at).getDay()]+=o.total;total+=o.total;}else if(o.at>=prev)last+=o.total;}
  return {days,total,last,today:now.getDay()};
}
function chartSvg(days){
  const W=320,H=120,max=Math.max(...days),top=max||1,P=days.map((v,i)=>[18+i*(W-36)/6,H-14-(v/top)*(H-34)]);
  let d=`M${P[0][0]} ${P[0][1]}`;
  for(let i=0;i<6;i++){const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(6,i+2)];
    d+=` C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)} ${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)} ${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;}
  const hi=days.indexOf(max);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Forbrug pr. dag denne uge">
    <defs><linearGradient id="spl" x1="0" x2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".25"/><stop offset="1" stop-color="var(--accent)"/></linearGradient></defs>
    ${P.map(p=>`<line x1="${p[0]}" y1="8" x2="${p[0]}" y2="${H-8}" stroke="var(--line)" stroke-dasharray="3 4"/>`).join("")}
    <path d="${d}" fill="none" stroke="url(#spl)" stroke-width="2.6" stroke-linecap="round"/>
    ${max?`<circle cx="${P[hi][0]}" cy="${P[hi][1]}" r="11" fill="var(--accent)" opacity=".18"/><circle cx="${P[hi][0]}" cy="${P[hi][1]}" r="5.5" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>`:""}</svg>`;
}

function saveCard(){
  const f=S.cf,d=f.num.replace(/\D/g,""),b=detectBrand(d),e={};
  if(d.length<13||d.length>19||!luhn(d)||(b==="amex"&&d.length!==15))e.num="Kortnummeret er ikke gyldigt";
  if((f.name||"").trim().length<2)e.name="Skriv navnet, som det står på kortet";
  const m=/^(0[1-9]|1[0-2])\/(\d\d)$/.exec(f.exp||"");
  if(!m)e.exp="Skriv som MM/ÅÅ";else{const end=new Date(2000+ +m[2],+m[1],1);if(end<=new Date())e.exp="Kortet er udløbet";}
  if(!/^\d+$/.test(f.cvc||"")||f.cvc.length!==(b==="amex"?4:3))e.cvc=b==="amex"?"4 cifre":"3 cifre";

}

/* ---------- Anmeldelser ----------
   Man kan anmelde et sted, når man har bestilt derfra eller spist der via Spis sammen. Egne anmeldelser gemmes på enheden.
   Eksempelanmeldelserne er tydeligt mærket, fordi restauranterne er opdigtede. */
const RV_NAMES=["Maria","Jonas","Sara","Ahmed","Line","Peter","Nina","Kasper","Ida","Omar","Emil","Freja","Lucas","Sofie","Ali","Clara"];
const RV_TEXTS=["Rigtig god mad og hyggelig stemning. Kommer igen!","Store portioner og venlig service. Lidt lang ventetid på maden i fredags.","Flot anrettet, og tjeneren havde gode vinforslag.","Vi delte flere retter, og alle var gode – især desserten.","Fin mad til prisen, men lidt for salt for min smag.","Min nye favorit i byen. Frisk og velsmagende."];
const RV_TAGS=["Lækker mad","God service","God portion","Hyggelig stemning","Flot anrettet","Fair pris"];
const RV_LBL=["","Dårlig","Under middel","Okay","Rigtig god","Fremragende"];
// Eksempelanmeldelser: 8 pr. sted med 1–5 stjerner fordelt efter stedets bedømmelse. Teksten passer til antallet af stjerner.
const RV_BY={5:["Rigtig god mad og hyggelig stemning. Kommer igen!","Min nye favorit i byen. Frisk og velsmagende.","Vi delte flere retter, og alle var gode – især desserten.","Fantastisk oplevelse fra start til slut. Søde folk og perfekt mad."],
 4:["Store portioner og venlig service. Lidt lang ventetid på maden i fredags.","Flot anrettet, og tjeneren havde gode vinforslag.","Rigtig god mad, men lidt dyrt for størrelsen."],
 3:["Fin mad til prisen, men lidt for salt for min smag.","Okay oplevelse. Maden var god, men ventetiden var lang.","Helt fin, men ikke noget, jeg ville gå langt for."],
 2:["Maden var lunken, da den kom på bordet, og der manglede en sauce.","Skuffende i forhold til billederne. Små portioner."],
 1:["Vores booking var væk, og vi måtte vente 40 minutter på et bord.","Kold mad og over en time mellem forret og hovedret. Desværre ikke godt nok."]};
function sampleReviews(r){
  const k=RESTAURANTS.indexOf(r),w=[1,2,3,4,5].map(s=>Math.exp(-((s-r.rating)**2)/2.2)),tot=w.reduce((a,b)=>a+b,0);
  const cnt=w.map(x=>x/tot*8),fl=cnt.map(Math.floor);let rem=8-fl.reduce((a,b)=>a+b,0);
  cnt.map((x,i)=>[x-fl[i],i]).sort((a,b)=>b[0]-a[0]).slice(0,rem).forEach(([,i])=>fl[i]++);
  const stars=[];fl.forEach((n,i)=>{for(let j=0;j<n;j++)stars.push(i+1);});
  if(k%3===0)stars[0]=k%2?1:2;
  return stars.map((s,j)=>{const arr=RV_BY[s];return {id:`s${k}-${j}`,rid:r.id,name:RV_NAMES[(k*3+j*7)%RV_NAMES.length],stars:s,text:arr[(k+j)%arr.length],
    tags:s>=4?[RV_TAGS[(k+j)%RV_TAGS.length]]:[],at:Date.now()-((j*2+1)+k%5)*86400e3-k*3600e3,sample:true};});
}
const RV_SORTS=[["high","5 → 1 stjerne"],["low","1 → 5 stjerner"],["new","Nyeste"]];
const rvSorter=()=>({new:(a,b)=>b.at-a.at,high:(a,b)=>b.stars-a.stars||b.at-a.at,low:(a,b)=>a.stars-b.stars||b.at-a.at}[S.rvSort]||((a,b)=>b.stars-a.stars));

const starChips=()=>`<div class="row chips" style="padding-top:8px" role="group" aria-label="Antal stjerner">${[0,5,4,3,2,1].map(n=>`<button class="chip sm" data-act="rv-star-f" data-v="${n}" aria-pressed="${(S.rvStar||0)===n}">${n?`${n} ${IC.star}`:"Alle"}</button>`).join("")}</div>`;
function vAllReviews(){

    const list=RESTAURANTS.map(r=>({r,...ratingOf(r)})).sort((a,b)=>S.rvSort==="low"?a.avg-b.avg:b.avg-a.avg);

  }
  const all=RESTAURANTS.flatMap(r=>reviewsFor(r)).filter(x=>!S.rvStar||x.stars===S.rvStar).sort(rvSorter());
  return `${topbar({title:"Anmeldelser"})}
   <div class="seg mx2" role="group" aria-label="Visning"><button data-act="ar-tab" data-v="reviews" aria-pressed="true">Alle anmeldelser</button><button data-act="ar-tab" data-v="rank" aria-pressed="false">Restauranter rangeret</button></div>

function rDist(r){const w=[1,2,3,4,5].map(k=>Math.exp(-((k-r.rating)**2)/0.9)),s=w.reduce((a,b)=>a+b,0),mine=S.reviews[r.id]||[];

/* ---------- Fællesbordet ----------
   Faste borde på restauranterne, hvor solospisere kan tage en plads. Hver dag får udvalgte restauranter et bord med et tema.
   Demo: gæsterne er opdigtede og genereres ud fra dagens dato, så bordene er de samme hele dagen. */
const THEMES=[
 ["Alle er velkomne","Et helt almindeligt bord – kom som du er, og mød nye mennesker over god mad."],
 ["Ny i byen","For dig, der lige er flyttet til København og gerne vil lære nogen at kende."],
 ["Sprogcafé på engelsk","Vi taler engelsk ved bordet – godt for tilflyttere og for dig, der vil øve dig."],
 ["Studerende","For studerende, der vil spise godt i godt selskab uden at bruge for mange penge."],
 ["Seniorer spiser ude","Et roligt bord for dig over 60, der savner selskab ved middagen."],
 ["Bogklub","Tag en bog med, du vil anbefale – eller kom bare og lyt."]];
const TALK_CARDS=["Hvad er det bedste, du har spist i år?","Hvilken ret minder dig om din barndom?","Hvis du kunne spise middag hvor som helst i verden i aften – hvor?","Hvad er dit yndlingssted i København?","Hvad har du lært for nylig, som overraskede dig?","Hvilken ret kan du selv lave bedst?","Hvad er den bedste rejse, du har været på?","Hvad laver du helst på en fridag?","Hvilken bog, film eller serie vil du anbefale lige nu?","Hvad ville du servere, hvis du ejede en restaurant?"];
function tablesToday(){
  const d=new Date(),key=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`,r=rng(d.getFullYear()*1000+d.getMonth()*40+d.getDate()+77),pool=demoPool();
  const sl=slotsToday(),cand=["18:00","18:30","19:00","19:30"],slots=sl.list.filter(s=>cand.includes(s)),use=slots.length?slots:cand;
  const open=RESTAURANTS.filter(x=>x.open).map(x=>[r(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]).slice(0,9);
  let pi=Math.floor(r()*pool.length);
  return open.map((rest,k)=>{
    const seats=[4,6,6,8][Math.floor(r()*4)],th=k%THEMES.length,full=r()<.12,slot=use[Math.floor(r()*use.length)];
    const id=`${rest.id}-${key}`,mine=!!(S.tables[id]),n=full&&!mine?seats:Math.min(seats-1,1+Math.floor(r()*(seats-2)));
    const guests=[];for(let g=0;g<n;g++){const p=pool[(pi++)%pool.length];let age=p.age;if(th===4)age=60+p.age%18;if(th===3)age=20+p.age%8;guests.push({name:p.name,age,bio:p.bio,verified:p.verified});}
    return {id,rid:rest.id,slot,seats,theme:th,guests,taken:n+(mine?1:0),mine,day:sl.day};});
}
function meetModeSeg(){return `<div class="seg mx2" role="group" aria-label="Vælg"><button data-act="meet-mode" data-v="tables" aria-pressed="${S.meetMode!=="match"}">Fællesborde</button><button data-act="meet-mode" data-v="match" aria-pressed="${S.meetMode==="match"}">Find en makker</button></div>`;}
const seatDots=t=>`<span class="seats" aria-label="${t.taken} af ${t.seats} pladser taget">${Array.from({length:t.seats},(_,i)=>`<i class="${i<t.taken?"on":""} ${t.mine&&i===t.taken-1?"me":""}"></i>`).join("")}</span>`;
function tableCard(t){
  const r=RESTAURANTS.find(x=>x.id===t.rid),free=t.seats-t.taken;
  return `<button class="card ncard tcard" data-act="table-open" data-t="${t.id}">${tileR(r,"m")}<span class="body">
    <span class="label">${t.mine?"Din plads":free?`${free} ${free===1?"ledig":"ledige"}`:"Fuldt"}</span><span class="nm">${esc(r.name)}</span>
    <span class="off">kl. ${t.slot}<small>${t.day==="i aften"?"I AFTEN":"I MORGEN"}</small></span><span class="tchip">${esc(THEMES[t.theme][0])}</span>${seatDots(t)}</span></button>`;
}
function tablesList(){
  const ts=tablesToday(),f=S.tableTheme;

   <div class="row chips" role="group" aria-label="Temaer">${[[-1,"Alle"],...THEMES.map((t,i)=>[i,t[0]])].map(([i,l])=>`<button class="chip" data-act="table-theme" data-v="${i}" aria-pressed="${f===i}">${esc(l)}</button>`).join("")}</div>
   <div class="list" style="padding-top:14px">${ts.filter(t=>f<0||t.theme===f).sort((a,b)=>(b.mine-a.mine)||((b.seats-b.taken>0)-(a.seats-a.taken>0))).map(tableCard).join("")||`<p class="empty">Ingen borde med dette tema i aften.</p>`}</div>`;
}

    <div class="card chatcard rate2"><h3 style="font-size:16px">Hvordan var aftenen?</h3><button class="primary center" data-act="table-rate" data-t="${t.id}" data-v="1">Godt – jeg kommer igen</button><button class="sec-btn" style="margin:0" data-act="table-rate" data-t="${t.id}" data-v="0">Ikke helt mig</button></div>`;
  else tail=`<div class="okhead"><div class="okic">${IC.tick}</div><h2 class="mh">Tak for i aften</h2></div><button class="primary center" data-act="go-tables">Find et nyt bord</button>`;
  return `${topbar({title:"Fællesbord",cart:false})}

   ${safetyBanner()}
   <div class="list" style="padding-top:14px">
    <section class="card tinfo"><p>${esc(th[1])}</p>${seatDots(t)}<span class="kw">${t.taken} af ${t.seats} pladser taget</span></section>

    ${t.guests.map(g=>`<div class="card person"><span class="av" aria-hidden="true">${esc(g.name[0])}</span><div class="body"><span class="nm">${esc(g.name)}, ${g.age}</span><span class="kw">${esc(g.bio)}</span>${g.verified?`<span class="vb">${IC.shield}Bekræftet profil</span>`:""}</div></div>`).join("")}
    ${tail}
    <p class="demo">Demo: gæsterne er opdigtede, og der bliver ikke reserveret et rigtigt bord.</p>

/* ---------- Tryghedstjek ----------
   Når man tjekker ind til en aftale (Spis sammen eller fællesbord), spørger appen efter et valgt antal minutter, om alt er godt.
   Svarer man ikke inden for 5 minutter, ville en rigtig app sende en sms med placering til tryghedskontakten. Her er det simuleret. */
function armSafety(ctx){
  if(S.prefs.safe===false)return;
  S.safe={due:Date.now()+S.safety.delay*60000,ctx,stage:"armed",start:Date.now()};
  setTimeout(()=>toast(S.safety.phone?`Tryghedstjek om ${S.safety.delay} min`:"Tilføj en tryghedskontakt i din profil, så vi kan give nogen besked."),2600);
}
function safetyBanner(){
  const s=S.safe;if(!s||s.stage==="ok")return "";
  const t=new Date(s.due).toLocaleTimeString("da-DK",{hour:"2-digit",minute:"2-digit"});
  return `<div class="sbanner">${IC.shield}<span>${s.stage==="armed"?`Tryghedstjek kl. ${t}`:"Tryghedstjek venter på dit svar"}</span><button data-act="${s.stage==="armed"?"safe-snooze":"safe-open"}">${s.stage==="armed"?"+15 min":"Svar"}</button><button data-act="safe-stop">Stop</button></div>`;
}
function safetyHelp(){
  const s=S.safety,c=S.safe&&S.safe.ctx||{},place=c.rid?RESTAURANTS.find(x=>x.id===c.rid).name:"";
  const msg=tr(`Hej, jeg har brug for hjælp. Jeg er på ${place||"en restaurant"} (sendt fra Seated).`);
  return `<a class="primary center" href="tel:112">Ring 112</a>
    ${s.phone?`<a class="sec-btn" href="sms:${s.phone.replace(/[^\d+]/g,"")}?&body=${encodeURIComponent(msg)}">Send besked til ${esc(s.name||s.phone)}</a><a class="sec-btn" href="tel:${s.phone.replace(/[^\d+]/g,"")}">Ring til ${esc(s.name||s.phone)}</a>`
      :`<button class="sec-btn" data-act="safety-sheet">Tilføj en tryghedskontakt</button>`}
    <button class="sec-btn" data-act="fake-call">Få et falsk opkald</button>`;
}
function safetyPrompt(){
  const s=S.safe;if(!s)return;
  const c=s.ctx||{},place=c.rid?RESTAURANTS.find(x=>x.id===c.rid).name:"";
  if(s.stage==="alert"){openSheet("safety",`<div class="safehead alert">${IC.shield}</div><h3>Vi har ikke hørt fra dig</h3>
    <p class="mutedp">${S.safety.phone?`Demo: I den rigtige app sender vi nu automatisk en sms til ${esc(S.safety.name||S.safety.phone)} med din placering.`:"Demo: I den rigtige app sender vi nu automatisk en sms til din tryghedskontakt med din placering."}</p>
    ${safetyHelp()}<button class="sec-btn" data-act="safe-ok">Jeg er okay alligevel</button>`);return;}
  if(s.stage==="help"){openSheet("safety",`<div class="safehead alert">${IC.shield}</div><h3>Vi er her</h3><p class="mutedp">Vælg, hvad der hjælper dig lige nu. Ved fare: ring altid 112.</p>${safetyHelp()}<button class="sec-btn" data-act="safe-ok">Jeg er okay alligevel</button>`);return;}
  openSheet("safety",`<div class="safehead">${IC.shield}</div><h3>Går det godt?</h3>
    <p class="mutedp">${c.type==="test"?"Dette er en test. Sådan ser tryghedstjekket ud, når du er ude at spise.":`Du er på ${esc(place)} med ${esc(c.names||"")}. Svar, så vi ved, at du har det godt.`}</p>
    <button class="primary center" data-act="safe-ok">Ja, alt er fint</button><button class="sec-btn" data-act="safe-snooze">Udsæt 15 minutter</button><button class="danger" style="width:100%;margin:0" data-act="safe-help">Nej, jeg har brug for hjælp</button>`);
}
setInterval(()=>{const s=S.safe;if(!s)return;
  if(s.stage==="armed"&&Date.now()>=s.due){s.stage="asking";s.askedAt=Date.now();save();safetyPrompt();try{navigator.vibrate&&navigator.userActivation&&navigator.userActivation.hasBeenActive&&navigator.vibrate([200,100,200]);}catch(e){}}
  else if(s.stage==="asking"&&Date.now()-s.askedAt>5*60000){s.stage="alert";save();safetyPrompt();}},1000);
function safetySheet(){const s=S.safety;
  openSheet("safetyset",`<h3>Tryghedstjek</h3><p class="mutedp">Når du har tjekket ind til en spiseaftale, spørger appen diskret, om alt er godt. Svarer du ikke, giver vi din tryghedskontakt besked.</p>
    <label class="fld"><span>Kontaktens navn</span><input class="txtin" id="sfname" value="${esc(s.name||"")}" autocomplete="off" placeholder="Fx Mor eller Sara"></label>
    <label class="fld" style="margin-top:10px"><span>Telefonnummer</span><input class="txtin" id="sfphone" type="tel" inputmode="tel" value="${esc(s.phone||"")}" placeholder="+45 12 34 56 78"></label>
    <p class="lbl" style="margin:14px 0 8px">Spørg mig efter</p><div class="wrapchips">${[1,20,30,45].map(m=>`<button class="chip" data-act="sf-delay" data-v="${m}" aria-pressed="${s.delay===m}">${m===1?"1 min (test)":m+" min"}</button>`).join("")}</div>
    <label class="tgl" style="margin-top:8px"><span>Tryghedstjek ved aftaler</span><input type="checkbox" data-pref="safe" ${S.prefs.safe!==false?"checked":""}><i></i></label>
    <button class="primary center" style="margin-top:12px" data-act="sf-save">Gem</button>`);}
function fakeCall(){
  closeSheet();const nm=S.safety.name||tr("Mor");$("#fakecall")&&$("#fakecall").remove();

const LINES={
 M1:{color:"#00845A",stops:[...SHARED,"Islands Brygge","DR Byen","Sundby","Bella Center","Ørestad","Vestamager"]},
 M2:{color:"#E6A800",stops:[...SHARED,"Amagerbro","Lergravsparken","Øresund","Amager Strand","Femøren","Kastrup","Lufthavnen"]},

const pt=n=>({lat:ST[n][0],lng:ST[n][1]});
const walkMin=(a,b)=>Math.max(1,Math.round(dist(a,b)*1.3/5*60));
const bikeMin=(a,b)=>Math.max(1,Math.round(dist(a,b)*1.25/15*60));
const walkM=(a,b)=>Math.round(dist(a,b)*1300/10)*10;
